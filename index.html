<meta charset="utf-8">
<title>Earth Mechanics Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, left course rail (drawer on phones), reading column ~70ch. Module hues borrowed from rocks & fluids. */
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#E3E8E3; --ink:#17201D; --muted:#56625D; --line:#CBD3CD;
  --accent:#1C6A56; --accent-ink:#FFFFFF;
  --found:#87661A; --cont:#1E5D93; --crust:#9A3D5B; --ice:#5A7DA6; --wave:#0D7F94; --thermal:#B4482C; --seis:#5A4EA6; --volc:#C2501B; --synth:#1C6A56;
  --good:#1D7744; --bad:#B0281F; --warn:#9A6400; --good-bg:#E0F1E6; --bad-bg:#F8E2DF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --sunk:#1D2622; --ink:#E3EAE6; --muted:#9BA8A2; --line:#2B3732;
  --accent:#5EC2A1; --accent-ink:#0A1410;
  --found:#D9B058; --cont:#72AFE6; --crust:#E27F9F; --ice:#9DB8DD; --wave:#4CC4D8; --thermal:#EE8A6B; --seis:#A99DF0; --volc:#F28B56; --synth:#5EC2A1;
  --good:#5BCB8B; --bad:#F2877E; --warn:#E5B64F; --good-bg:#15301F; --bad-bg:#3A1C19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --sunk:#1D2622; --ink:#E3EAE6; --muted:#9BA8A2; --line:#2B3732;
  --accent:#5EC2A1; --accent-ink:#0A1410;
  --found:#D9B058; --cont:#72AFE6; --crust:#E27F9F; --ice:#9DB8DD; --wave:#4CC4D8; --thermal:#EE8A6B; --seis:#A99DF0; --volc:#F28B56; --synth:#5EC2A1;
  --good:#5BCB8B; --bad:#F2877E; --warn:#E5B64F; --good-bg:#15301F; --bad-bg:#3A1C19; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;min-width:0;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.08rem;white-space:nowrap}
.brand svg{flex:none}
.top-spacer{flex:1}
.top-stat{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.top-stat b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.top-links{display:flex;gap:4px}
.top-links a{text-decoration:none;color:var(--ink);font-size:.9rem;padding:6px 10px;border-radius:7px}
.top-links a:hover,.top-links a.on{background:var(--sunk)}

/* shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:272px minmax(0,1fr);gap:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#side{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:20px 40px;padding-right:18px;border-right:1px solid var(--line)}
#view{min-width:0;padding-block:28px 80px;padding-left:36px}
.side-sec{margin-bottom:18px}
.side-sec > .eyebrow{display:block;margin:0 0 8px 8px}
.side-mod{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:7px 8px;border-radius:8px;font-weight:500;font-size:.93rem}
.side-mod:hover{background:var(--sunk)}
.side-mod.on{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.side-dot{width:10px;height:10px;border-radius:3px;background:var(--mc);flex:none}
.side-mod .pct{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.side-les{list-style:none;margin:2px 0 8px 0;padding:0 0 0 18px;border-left:2px solid color-mix(in srgb,var(--mc) 40%,transparent);margin-left:12px}
.side-les a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:.86rem;padding:4px 8px;border-radius:6px;line-height:1.35}
.side-les a:hover{color:var(--ink);background:var(--sunk)}
.side-les a.on{color:var(--ink);font-weight:600}
.side-les .tick{width:12px;flex:none;color:var(--good);font-size:.8rem}

@media (max-width:520px){ .brand span{font-size:.95rem} }
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #view{padding-left:0}
  #side{position:fixed;z-index:20;inset:calc(58px + env(safe-area-inset-top,0px)) 0 0 0;height:auto;background:var(--surface);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    border-right:0;transform:translateX(-100%);transition:transform .2s ease;visibility:hidden}
  body.nav-open #side{transform:none;visibility:visible}
  .menu-btn{display:inline-block}
  .top-links,.top-stat{display:none}
}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero p.lede{font-size:1.1rem;color:var(--muted);max-width:56ch;margin-top:12px}
.seismo{width:100%;height:150px;display:block}
.seis-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer;text-decoration:none;font-weight:500;font-size:.95rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:18px 0 34px}
.mod-card{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;text-decoration:none;color:var(--ink);overflow:hidden}
.mod-card:hover{border-color:var(--mc)}
.mod-card .strata{position:absolute;inset:0 0 auto 0;height:6px;background:var(--mc)}
.mod-card h3{font-size:1.12rem}
.mod-card p{font-size:.9rem;color:var(--muted);line-height:1.5}
.mod-card .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:auto}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.lvl1{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.chip.lvl2{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.chip.lvl3{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.chip .pip{width:7px;height:7px;border-radius:50%}
.lvl1 .pip{background:var(--good)} .lvl2 .pip{background:var(--warn)} .lvl3 .pip{background:var(--bad)}
.state{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.state.Familiar{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--ink)}
.state.Proficient{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--ink)}
.state.Mastered{background:var(--good);color:var(--surface)}
.state.Attempted{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

/* module page */
.mod-head{border-left:6px solid var(--mc);padding:4px 0 4px 18px;margin-bottom:22px}
.mod-head p{color:var(--muted);max-width:68ch;margin-top:10px}
.why{background:color-mix(in srgb,var(--mc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));border-radius:12px;padding:16px 18px;margin:0 0 24px;max-width:78ch}
.les-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:820px}
.les-list a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.les-list a:hover{border-color:var(--mc)}
.les-num{font-family:var(--f-mono);font-size:.85rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--mc);color:var(--ink)}
.les-num.done{background:var(--mc);color:var(--surface)}
.les-list .t{font-weight:600}
.les-list .s{font-size:.86rem;color:var(--muted);line-height:1.4;margin-top:2px}
.les-list .m{font-size:.78rem;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.squares{display:flex;flex-wrap:wrap;gap:5px}
.sq{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:0}
.sq.tried{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.sq.ok{border-color:var(--good);background:var(--good)}
.sq.cur{outline:2px solid var(--ink);outline-offset:1px}

/* lesson */
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted)}
.lesson{max-width:760px}
.lesson .lede{font-size:1.12rem;margin:14px 0 20px;color:var(--ink)}
.lesson section{margin:26px 0}
.lesson section h3{margin-bottom:8px}
.lesson section p + p{margin-top:10px}
.lesson ul,.lesson ol{padding-left:1.3em;margin:8px 0}
.lesson li{margin:4px 0}
.keybox{border:1.5px solid var(--mc);border-radius:12px;padding:16px 18px;background:color-mix(in srgb,var(--mc) 7%,var(--surface));margin:20px 0}
.keybox .eyebrow{color:var(--ink)}
.keybox .k{min-width:0;overflow-x:auto;font-size:1.08rem;margin-top:6px}
.callout{border-radius:10px;padding:14px 16px;background:var(--sunk);margin:18px 0}
.callout .eyebrow{display:block;margin-bottom:4px}
.src{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto;margin:10px 0}
details.ex{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:20px 0}
details.ex > summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.ex > summary::-webkit-details-marker{display:none}
details.ex > summary::before{content:"+";font-family:var(--f-mono);width:20px;height:20px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem}
details.ex[open] > summary::before{content:"−"}
details.ex .exb{padding:0 18px 16px}
.connects{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.connects a{text-decoration:none}
.les-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.katex-display{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:12px 0;padding:2px 0}
math{font-size:1.06em}
.katex-display math{font-size:1.12em}

/* problems */
.prob{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0}
.prob .ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.prob .q{font-size:1.02rem}
.prob .q p + p{margin-top:8px}
.choices{display:grid;gap:8px;margin:14px 0}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.choice:hover{border-color:var(--muted)}
.choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.choice .ltr{font-family:var(--f-mono);font-size:.8rem;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px}
.numrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.numrow input{font:inherit;font-family:var(--f-mono);width:180px;max-width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.numrow .unit{font-family:var(--f-mono);color:var(--muted)}
textarea.notes{width:100%;min-height:90px;font:inherit;font-size:.95rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;margin:12px 0}
.fb{border-radius:9px;padding:10px 14px;margin-top:12px;font-size:.95rem}
.fb.ok{background:var(--good-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.fb.no{background:var(--bad-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.hint{border-left:3px solid var(--warn);padding:6px 12px;margin-top:10px;background:color-mix(in srgb,var(--warn) 8%,var(--surface));border-radius:0 8px 8px 0;font-size:.95rem}
.sol{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.sol .eyebrow{display:block;margin-bottom:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* drill */
.drill-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:800px}
.drill-q{font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.25;margin:10px 0 14px;text-wrap:balance}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.rate button{min-width:96px}

/* widgets */
.widget{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;margin:20px 0}
.widget .wt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-bottom:12px}
.ctrl label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:8px}
.ctrl label b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.readout div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.readout span{display:block;font-size:.72rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.readout b{font-family:var(--f-mono);font-weight:500;font-size:1rem}
.plot{width:100%;height:auto;display:block}
.plot text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.plot .ax{stroke:var(--muted);stroke-width:1;fill:none}
.plot .grid{stroke:var(--line);stroke-width:1;fill:none}
.plot .s1{stroke:var(--mc,var(--accent));stroke-width:2.2;fill:none}
.plot .s2{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.plot .s3{stroke:var(--warn);stroke-width:1.6;fill:none}
.plot .dot{fill:var(--mc,var(--accent));stroke:var(--surface);stroke-width:2}
.plot .lbl{fill:var(--ink)}
canvas.wcan{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
.mapwrap{overflow-x:auto}
.mapwrap svg{min-width:760px;width:100%;height:auto;display:block}
.map-node{cursor:pointer}
.map-node rect{fill:var(--surface);stroke:var(--mc);stroke-width:1.6}
.map-node:hover rect,.map-node:focus rect{fill:color-mix(in srgb,var(--mc) 15%,var(--surface))}
.map-node text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.map-edge{stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.7}
.map-elab{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  <a class="brand" href="#home" aria-label="Earth Mechanics Academy home">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="var(--ink)"/><path d="M4 16 H9 L11 12 L13 21 L15 6 L17 24 L19 13 L21 17 L23 15 H26" fill="none" stroke="var(--surface)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>Earth Mechanics Academy</span></a>
  <nav class="top-links" aria-label="Main">
    <a href="#home" data-r="home">Course</a><a href="#practice-mixed" data-r="practice-mixed">Mixed review</a><a href="#drill" data-r="drill">Exam drill</a>
  </nav>
  <div class="top-spacer"></div>
  <div class="top-stat"><span>Problems solved</span><b id="topSolved">0</b></div>
</div></header>
<div class="shell"><nav id="side" aria-label="Course"></nav><main id="view"></main></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>window.COURSE={modules:[],drill:[]};</script>
<script src="content/foundations.js" charset="utf-8"></script>
<script src="content/continuum.js" charset="utf-8"></script>
<script src="content/waves.js" charset="utf-8"></script>
<script src="content/ice.js" charset="utf-8"></script>
<script src="content/crust.js" charset="utf-8"></script>
<script src="content/thermal.js" charset="utf-8"></script>
<script src="content/seismology.js" charset="utf-8"></script>
